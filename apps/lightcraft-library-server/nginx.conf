server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # These files keep the same names between builds; always revalidate after a deploy.
    add_header Cache-Control "no-cache" always;

    location = /lightcraft-runtime.js {
        alias /tmp/lightcraft-runtime.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        gzip_static on;
        try_files $uri =404;
    }

    location / {
        gzip_static on;
        try_files $uri $uri/ =404;
    }
}
